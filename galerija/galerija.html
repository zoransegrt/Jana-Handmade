<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Galerija | Jana Handmade</title>
    <link rel="icon" type="image/png" href="/img/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Luxury fonts: Playfair Display (serif) and Poppins (sans-serif) -->
    <link
      href="https://fonts.googleapis.com/css?family=Playfair+Display:700,800&family=Poppins:400,500,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="galerija.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="site-header">
      <div class="logo">
        <a href="/index.html">
          <img
            src="/img/logo.png"
            alt="Jana Handmade Logo"
            width="125"
            height="125"
          />
        </a>
      </div>
      <div class="brand">
        <img
          src="/img/jana.png"
          alt="Jana Handmade Brand"
          class="brand-image"
        />
      </div>
      <div class="menu-toggle" id="menuToggle" aria-label="Open menu">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <nav class="dropdown-menu" id="dropdownMenu">
        <a href="/index.html">Home</a>
        <a href="/o nama/onama.html">O nama</a>
        <a href="/shop/shop.html">Shop</a>
        <a href="/kontakt/kontakt.html">Kontakt i Lokacija</a>
        <a href="galerija.html">Galerija</a>
        <div class="lang-select">
          <a href="galerija.html"
            ><img src="/img/srb.png" alt="Serbian" class="flag"
          /></a>
          <a href="#"><img src="/img/uk.png" alt="English" class="flag" /></a>
        </div>
      </nav>
    </header>
    <main>
      <section class="gallery-hero">
        <div class="gallery-hero-bg"></div>
        <div class="gallery-hero-content">
          <h1>Galerija</h1>
          <hr class="divider" />
          <p>
            Pogledajte naše radove, trenutke iz radionice i posebne komade iz
            kolekcije Jana Handmade.
          </p>
        </div>
      </section>
      <section class="gallery-section">
        <div class="gallery-grid">
          <img
            src="/img/lyra/lyra_vise.png"
            alt="Galerija 1"
            class="gallery-img"
          />
          <img
            src="/img/kyana/kyana_vise.png"
            alt="Galerija 2"
            class="gallery-img"
          />
          <img
            src="/img/lyra/ly_red.png"
            alt="Galerija 3"
            class="gallery-img"
          />
          <img
            src="/img/kyana/ky_red.png"
            alt="Galerija 4"
            class="gallery-img"
          />
          <img
            src="/img/lyra/ly_beige.png"
            alt="Galerija 5"
            class="gallery-img"
          />
          <img
            src="/img/kyana/ky_beige.png"
            alt="Galerija 6"
            class="gallery-img"
          />
          <img
            src="/img/lyra/ly_black.png"
            alt="Galerija 7"
            class="gallery-img"
          />
          <img
            src="/img/kyana/kyana_pile.png"
            alt="Galerija 8"
            class="gallery-img"
          />
          <!-- Add more images as needed -->
        </div>
      </section>
      <!-- Modal for zoom (hidden by default, shown with JS) -->
      <div id="modal" class="modal">
        <span id="modal-close" class="modal-close">&times;</span>
        <img class="modal-content" id="modal-img" alt="Zoomed" />
      </div>
    </main>
    <footer>
      <div class="footer-social">
        <a href="https://www.instagram.com/jana_handmadee/" target="_blank">
          <img src="/img/instagram.png" alt="Instagram" class="instagram" />
        </a>
      </div>
      <p>&copy; 2025 Jana Handmade. Sva prava zadržana.</p>
    </footer>
    <script src="galerija.js"></script>
  </body>
</html>
